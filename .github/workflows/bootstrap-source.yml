name: Bootstrap Astra V1 source
on:
  push:
    branches:
      - feature/australia-pharmacy-2027-v1
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/australia-source.b64
          base64 -d /tmp/australia-source.b64 > /tmp/australia-source.tar.xz
          tar -xJf /tmp/australia-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit imported V1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TNS Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import Astra V1 source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
