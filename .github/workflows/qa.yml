name: Preview QA
on:
  pull_request:
  push:
    branches:
      - 'feature/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile scripts/seed_data.py scripts/build.py scripts/validate.py
      - run: python3 scripts/build.py
        env:
          CONTEXT: deploy-preview
      - run: node --test tests/matcher.test.cjs
      - run: python3 scripts/validate.py
